name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run dependency-free static audit
        run: python3 tests/security_audit.py
      - name: Run static page contract
        run: python3 tests/verify_page.py
      - name: Verify generated SEO and indexable inventory
        run: python3 tools/generate_seo.py --check && python3 tests/verify_seo.py
      - name: Verify consent and event payloads without sending traffic
        run: node tests/verify_analytics.js
